name: Update Submodules 2
 
# Trigger: Run weekly, or manually via GitHub UI  
on:  
  schedule:  
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight UTC  
  workflow_dispatch:  # Allow manual runs  
 
jobs:  
  update-submodules:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout parent repo  
        uses: actions/checkout@v7 
 
      - name: Update submodules  
        run: |  
          # Sync submodule remote URLs (in case .gitmodules changed)  
          git submodule sync --recursive  
          # Update submodules to latest remote commits and merge  
          git submodule update --remote --merge --recursive  
          # Stage changes to submodule references  
          git add .gitmodules
          git add buildroot

      - name: Commit and push changes  
        run: |  
          git config --global user.name "GitHub Actions Bot"  
          git config --global user.email "actions@github.com"  
          git commit -m "Update submodules to latest versions" || echo "No changes to commit"  
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}  
